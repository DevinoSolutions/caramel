name: Release – Android App (Kotlin + Compose, com.devino.caramel)

# Builds apps/caramel-android (the native Android twin of the iOS container in apps/caramel-apple).
#
# Triggers (owner pushes the tags; agents never do):
#   - pull_request touching apps/caramel-android or this file: assembleDebug + JVM unit tests + lint.
#     It never signs and never uploads, so CI proves the build before anything can ship.
#   - tag `android-v*`: the same verification, then a SIGNED release AAB + universal APK and an
#     upload of the AAB to the Play INTERNAL track. `v*` tags belong to release-extension.yml and
#     `apple-v*` to release-apple-app.yml.
#   - workflow_dispatch (the workflow file must exist on the default branch): same as a tag, but
#     `dry_run` (default true) builds + signs + verifies and SKIPS the Play upload, mirroring the
#     other Devino Android callers (marka-pwa-android release.yml). `internal_preview` (default
#     false) lets a dispatch FROM main past the T-7852 gate for an INTERNAL-only build; see below.
#
# INTERNAL track only: nothing here promotes a build to closed/open/production. The universal APK
# (app-release.apk) is attached as a workflow artifact for the Amazon Appstore; it is the same
# signed build, so it needs no GMS and no extra secret.
#
# Secrets (names only; this workflow never prints them). The first four mirror the shared
# Devino Android convention (marka / superbooks / dodomain use ANDROID_KEYSTORE_B64 and
# PLAY_SERVICE_ACCOUNT_JSON); the app-specific ones are prefixed CARAMEL_:
#   ANDROID_KEYSTORE_B64        base64 of the upload keystore
#   CARAMEL_KEYSTORE_PASSWORD   keystore store password
#   CARAMEL_KEY_ALIAS           upload key alias
#   CARAMEL_KEY_PASSWORD        upload key password
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play service-account JSON (plain text); only when uploading
# A missing secret fails the release job loudly, naming the secret.
#
# versionCode = 100 + this workflow's run number; versionName: apps/caramel-android/app/build.gradle.kts.
# Pitfalls (Play rejects a versionCode it has already seen, and codes never go back down):
#   - the run number is ONE counter shared by every trigger of this workflow (PR runs, dry runs,
#     tags), so codes skip numbers; that is fine, they only have to increase;
#   - a re-run of a run REUSES its run number, so a failed upload must be retried with a NEW run
#     (push a new tag / dispatch again), never with "Re-run jobs";
#   - renaming this workflow file or its `name:` resets the run counter. The fixed +100 offset is
#     there so such a reset cannot fall below codes already uploaded; if it ever happens, raise the
#     offset in the Build step past the highest versionCode in Play Console.
#
# The release job also refuses to run while any TODO(T-7852) marker is left in the app source (the WebView web-session
# handoff is unfinished: see the "Block the release" step). The only way past it is a workflow_dispatch from main with
# `internal_preview` = true: the markers are then printed as warnings and the run is labelled INTERNAL PREVIEW. Such a
# build (Play internal track) has signed-out web tabs and must never be submitted for review or promoted. Tag pushes
# ignore the input and stay blocked.
#
# Release gating (no GitHub Environment, which is a repo-settings change): a real upload needs a
# commit on main (dispatch from main, or a tag whose commit is an ancestor of origin/main) and a tag
# equal to android-v<versionName>. TODO(owner): add a protected Environment with required reviewers
# for the Play upload and keystore secrets; until then anyone with write access can push a tag.

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build + sign + verify only, SKIP the Play upload (tag pushes always upload)'
        type: boolean
        default: true
      play_status:
        description: 'Play release status (use "draft" while the Play app record has never been published)'
        type: choice
        options: [completed, draft]
        default: completed
      internal_preview:
        description: 'true = allow an INTERNAL-only build (Play internal track) while TODO(T-7852) markers remain; web tabs are signed out. Tag pushes ignore this and stay blocked. Never submit such a build for review.'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/caramel-android/**'
      - '.github/workflows/release-android-app.yml'

concurrency:
  group: release-android-app-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ANDROID_DIR: apps/caramel-android
  PACKAGE_NAME: com.devino.caramel

jobs:
  verify:
    name: Build debug, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: assembleDebug + unit tests + lint
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      # The R8 / resource-shrinking / lintVital release path, unsigned (no keystore here), so a
      # shrinker problem shows on the PR and not for the first time on a release tag.
      - name: assembleRelease (unsigned) + lintVitalRelease
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon assembleRelease lintVitalRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verify-reports
          path: |
            ${{ env.ANDROID_DIR }}/app/build/reports
            ${{ env.ANDROID_DIR }}/app/build/test-results
          if-no-files-found: ignore
          # T-7021: org artifact quota; reports are only read on the run that produced them.
          retention-days: 3

  release:
    name: Sign release AAB + APK, upload to Play internal unless dry run
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPLOAD_TO_PLAY: ${{ github.event_name == 'push' || inputs.dry_run == false }}
      PLAY_STATUS: ${{ inputs.play_status || 'completed' }}
    steps:
      - name: Require the signing secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CARAMEL_KEYSTORE_PASSWORD: ${{ secrets.CARAMEL_KEYSTORE_PASSWORD }}
          CARAMEL_KEY_ALIAS: ${{ secrets.CARAMEL_KEY_ALIAS }}
          CARAMEL_KEY_PASSWORD: ${{ secrets.CARAMEL_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_B64 CARAMEL_KEYSTORE_PASSWORD CARAMEL_KEY_ALIAS CARAMEL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name: the release build cannot be signed."
              missing=1
            fi
          done
          if [ "$UPLOAD_TO_PLAY" = "true" ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON: the AAB cannot be uploaded to Play."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the tag-is-on-main check needs history

      # The 1.6 shell shows grabcaramel.com in a WebView with NO web session until the handoff
      # (POST /api/app/web-session/handoff, T-7852) is wired: the Saved and Account tabs bounce to
      # Deals. Every TODO(T-7852) marker in the app source is part of that unfinished work, so a
      # release build stops while any is left. Runs only in this release job (never on PRs).
      # Passes with warnings ONLY for a workflow_dispatch from main with internal_preview = true.
      # Tag pushes, a plain dispatch and a dispatch from a branch all fail exactly as before.
      - name: Block the release while the web-session handoff (T-7852) is unfinished
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTERNAL_PREVIEW: ${{ inputs.internal_preview }}
          REF: ${{ github.ref }}
        run: |
          markers="$(grep -rn 'TODO(T-7852)' "$ANDROID_DIR/app/src/main" || true)"
          if [ -n "$markers" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INTERNAL_PREVIEW" = "true" ] && [ "$REF" = "refs/heads/main" ]; then
              while IFS= read -r line; do echo "::warning::$line"; done <<<"$markers"
              echo "::warning::INTERNAL PREVIEW build: the Android WebView shell has no web session yet (T-7852 unfinished), so the Saved and Account tabs are signed out. Play internal track only; never submit or promote this build."
              {
                echo "### INTERNAL PREVIEW — not for Play production submission; T-7852 markers present"
                echo
                echo "The web tabs of this build are signed out. Markers still present:"
                echo
                echo '```'
                echo "$markers"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Release stopped on purpose: the Android WebView shell has no web session yet, so the Saved and Account tabs do not work for signed-in users. T-7852 (POST /api/app/web-session/handoff, wired into MainActivity.handleCallback and AppContainer.webSessionActive) is unfinished. Remove the TODO(T-7852) markers once it ships, then re-tag with a new tag. Markers still present:"
              echo "$markers"
              exit 1
            fi
          fi

      - name: Release gating (main only for real uploads; tag must match versionName)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version_name="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' "$ANDROID_DIR/app/build.gradle.kts")"
          test -n "$version_name" || { echo "::error::Could not read versionName from build.gradle.kts."; exit 1; }
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "android-v$version_name" ]; then
              echo "::error::Tag $REF_NAME does not match versionName $version_name (expected android-v$version_name)."
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tagged commit $GITHUB_SHA is not on main. Release tags must point at main."
              exit 1
            fi
          elif [ "$UPLOAD_TO_PLAY" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A real (non-dry-run) dispatch must run from main, not $REF. Use dry_run=true on a branch."
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          keystore="$RUNNER_TEMP/caramel-upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          test -s "$keystore" || { echo "::error::ANDROID_KEYSTORE_B64 did not decode to a keystore."; exit 1; }
          echo "CARAMEL_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB + universal APK
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          CARAMEL_KEYSTORE_PASSWORD: ${{ secrets.CARAMEL_KEYSTORE_PASSWORD }}
          CARAMEL_KEY_ALIAS: ${{ secrets.CARAMEL_KEY_ALIAS }}
          CARAMEL_KEY_PASSWORD: ${{ secrets.CARAMEL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PcaramelVersionCode=$((100 + ${{ github.run_number }})) bundleRelease assembleRelease

      - name: Verify the artifacts are signed
        working-directory: ${{ env.ANDROID_DIR }}/app/build/outputs
        run: |
          verify_output="$(jarsigner -verify bundle/release/app-release.aab 2>&1)" || true
          echo "$verify_output"
          grep -q '^jar verified' <<<"$verify_output" || { echo "::error::jarsigner did not report 'jar verified' for the AAB."; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs apk/release/app-release.apk

      - name: Upload AAB + universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caramel-android-release
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/app-release.aab
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.ANDROID_DIR }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # T-7021: org artifact quota. This copy is a convenience: the AAB of record is
          # the one uploaded to the Play internal track below. A bundle that must outlive
          # 3 days goes to MinIO via the shared keep-artifacts path (DevinoSolutions/.github).
          retention-days: 3

      - name: Upload to Play internal track
        if: env.UPLOAD_TO_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ env.PLAY_STATUS }}
          mappingFile: ${{ env.ANDROID_DIR }}/app/build/outputs/mapping/release/mapping.txt

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/caramel-upload.keystore" serviceAccountJson.json
