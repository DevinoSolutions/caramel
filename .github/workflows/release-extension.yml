name: Release – Extension

# Firefox/AMO IS automated now — `package` builds a Firefox variant of dist/ and
# `publish_firefox` signs and submits it to addons.mozilla.org — but the job is
# DORMANT until the owner creates two repository secrets:
#
#   AMO_JWT_ISSUER   ("JWT issuer")
#   AMO_JWT_SECRET   ("JWT secret")
#
# both minted at https://addons.mozilla.org/en-US/developers/addon/api/key/
# (one pair per AMO account; the secret is shown exactly once).
#
# Until they exist, publish_firefox's FIRST step notices they are empty, writes
# a ::warning:: plus a run-summary block saying Firefox was not published and
# why, and every later step in that job is gated off — the release stays green
# and Chrome/Safari are untouched. That gate is the whole reason the Firefox leg
# was missing here: a job referencing unset secrets resolves them to empty
# strings and fails deep inside the upload instead of up front. The cost of
# leaving it out was real — the AMO listing (public slug `grabcaramel`) served
# 1.0.3, reviewed 2025-07-12, to ~829 daily users while Chrome and Safari moved
# on.
#
# Once the secrets exist the job runs for real: it proves the credentials
# against the AMO API, refuses to ship a version AMO already lists, and fails
# loudly on any upload or validation error. It never degrades to a silent pass.
# Still manual afterwards: Mozilla's human review of the submitted version.
#
# Microsoft Edge follows the SAME dormant-until-secrets pattern (`publish_edge`),
# reusing the Chrome extension.zip untouched — Edge is Chromium. It stays skipped
# and GREEN until three repository secrets exist:
#
#   EDGE_PRODUCT_ID  — the add-on Product ID (Partner Center dashboard)
#   EDGE_CLIENT_ID   — Publish API v1.1 client id (Partner Center → Publish API)
#   EDGE_API_KEY     — Publish API v1.1 key (shown once at creation)
#
# Edge developer registration and publishing are free; registering the item once
# in Partner Center to obtain the Product ID is the only human step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the guards, build and package, but skip every store upload and the GitHub Release'
        type: boolean
        default: false

# Releases are opt-in: they fire on a pushed `v*` tag (or a deliberate manual
# dispatch), never on merged PRs. The old trigger shipped a store upload on
# every merge into main unless the PR *title* happened to contain a skip token,
# which is how the Chrome listing quietly froze at an old version for months.
concurrency:
  group: release-extension
  cancel-in-progress: false

permissions:
  contents: read

env:
  SAFARI_BUNDLE_ID: ${{ vars.SAFARI_BUNDLE_ID }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}
  APP_NAME: ${{ vars.APP_NAME }}
  MAC_CATEGORY: ${{ vars.MAC_CATEGORY }}

jobs:
  guard:
    name: '🛡️ Version + freeze guard'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Announce run mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "DRY RUN: guards, build and packaging only — no store uploads, no GitHub Release." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::warning::Running from ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}', not a tag. Store uploads may still run, but no GitHub Release will be created and the store version will not be traceable to a tag."
          fi

      # ONE version authority: apps/caramel-extension/manifest.json. Every other
      # version field in the extension package must agree with it, and the tag
      # must be `v` + that version. Nothing in this workflow computes, bumps or
      # infers a version any more — the Safari marketing version is this value
      # too, and only the numeric TestFlight build number is derived at runtime.
      - name: Assert one version authority
        id: version
        run: |
          set -euo pipefail
          dir="${WORKING_DIRECTORY}"
          if [ -z "$dir" ]; then
            echo "::error::Repository variable WORKING_DIRECTORY is unset — cannot locate the extension manifest."
            exit 1
          fi
          for f in manifest.json manifest-firefox.json package.json; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::Expected $dir/$f to exist. Check the WORKING_DIRECTORY repository variable."
              exit 1
            fi
          done

          version=$(jq -er '.version' "$dir/manifest.json")
          firefox_version=$(jq -er '.version' "$dir/manifest-firefox.json")
          package_version=$(jq -er '.version' "$dir/package.json")

          echo "manifest.json          $version"
          echo "manifest-firefox.json  $firefox_version"
          echo "package.json           $package_version"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::manifest.json version '$version' is not a plain X.Y.Z version."
            exit 1
          fi
          if [ "$firefox_version" != "$version" ]; then
            echo "::error::manifest-firefox.json version '$firefox_version' disagrees with manifest.json '$version'."
            exit 1
          fi
          if [ "$package_version" != "$version" ]; then
            echo "::error::package.json version '$package_version' disagrees with manifest.json '$version'."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match manifest version — expected 'v${version}'."
              exit 1
            fi
            echo "Tag ${GITHUB_REF_NAME} matches manifest version $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing extension version **$version**" >> "$GITHUB_STEP_SUMMARY"

      # Proves all four Chrome Web Store secrets are live BEFORE we spend ~30
      # minutes on the macOS build. A wrong or expired refresh token otherwise
      # only surfaces at the very last step of the run.
      - name: Assert Chrome Web Store credentials are live
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          for name in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is unset or empty."
              exit 1
            fi
          done

          curl -sS --fail-with-body -o /tmp/cws-token.json \
            -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CHROME_CLIENT_ID}" \
            --data-urlencode "client_secret=${CHROME_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CHROME_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token"
          access_token=$(jq -er '.access_token' /tmp/cws-token.json)

          http=$(curl -sS -o /tmp/cws-item.json -w '%{http_code}' \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}?projection=DRAFT")
          if [ "$http" != "200" ]; then
            echo "::error::Chrome Web Store items.get returned HTTP $http — credentials or extension id are wrong."
            cat /tmp/cws-item.json
            exit 1
          fi
          jq -er '.id' /tmp/cws-item.json > /dev/null
          echo "Chrome Web Store credentials verified against items.get."

      # FREEZE-GUARD — refuse to ship a version the store already serves.
      #
      # What this checks, precisely: Chrome's own extension update service
      # (clients2.google.com/service/update2/crx) reports the version currently
      # PUBLISHED and served to installed users. The job fails unless the
      # manifest version is strictly greater than that.
      #
      # Why not the authenticated items.get endpoint: its `projection` parameter
      # documents two values but Google's reference states verbatim —
      #   "Note that only "DRAFT" is supported at this time."
      # — and the documented v1.1 Item resource carries only id, kind,
      # publicKey, uploadState and itemError. There is no published-version
      # field to read. (The newer V2 API does expose
      # `publishedItemRevisionStatus` via
      # `chromewebstore.googleapis.com/v2/publishers/PUBLISHER_ID/items/ID:fetchStatus`,
      # but that needs a publisher id we hold no secret for. Migrating to it is
      # the clean upgrade path once CHROME_PUBLISHER_ID exists.)
      #
      # NOT guaranteed by this guard:
      #   * A submission already queued for review is invisible here — the
      #     update service still reports the previous live version until review
      #     completes, so two tags pushed back to back can both pass.
      #   * A staged/partial percentage rollout reports the default cohort's
      #     version, not the highest staged one.
      #   * An item that has never been published (or a wrong id) returns
      #     status="error-unknownApplication" with no version — that fails the
      #     job by design rather than passing an unverifiable release.
      # Any transport error, unexpected status or missing version attribute is a
      # hard failure: this guard never degrades to a pass.
      - name: Chrome Web Store publish freeze-guard
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -o /tmp/cws-updatecheck.xml \
            "https://clients2.google.com/service/update2/crx?response=updatecheck&prodversion=999.0&acceptformat=crx3&x=id%3D${CHROME_EXTENSION_ID}%26uc"
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          NS = "{http://www.google.com/update2/response}"


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          def parse(version, label):
              parts = version.split(".")
              if not all(part.isdigit() for part in parts):
                  fail(f"{label} version {version!r} is not numeric-dotted; cannot compare.")
              return [int(part) for part in parts]


          raw = open("/tmp/cws-updatecheck.xml", "rb").read()
          # The payload is a fixed-shape response from Google's own update
          # service, but it is still untrusted input to an XML parser. A
          # doctype or entity declaration has no legitimate place in it, so
          # reject the document outright rather than hand expat anything that
          # could expand (billion-laughs) or dereference (XXE).
          if b"<!DOCTYPE" in raw or b"<!ENTITY" in raw:
              fail("Chrome update service response contained a doctype/entity declaration; refusing to parse it.")

          try:
              root = ET.fromstring(raw)
          except ET.ParseError as exc:
              fail(f"Chrome update service returned unparseable XML: {exc}")

          app = root.find(f"{NS}app")
          if app is None:
              fail("Chrome update service response contained no <app> element.")

          status = app.get("status")
          if status != "ok":
              fail(
                  f"Chrome update service reported status={status!r} for the configured "
                  "extension id. Either the id is wrong or the item has never been "
                  "published, so the published version cannot be verified."
              )

          updatecheck = app.find(f"{NS}updatecheck")
          published = updatecheck.get("version") if updatecheck is not None else None
          if not published:
              fail("Chrome update service response carried no published version attribute.")

          manifest = os.environ["MANIFEST_VERSION"]
          published_parts = parse(published, "published")
          manifest_parts = parse(manifest, "manifest")
          width = max(len(published_parts), len(manifest_parts))
          published_parts += [0] * (width - len(published_parts))
          manifest_parts += [0] * (width - len(manifest_parts))

          print(f"Chrome Web Store currently publishes {published}; manifest is {manifest}")
          if manifest_parts <= published_parts:
              fail(
                  f"Manifest version {manifest} is not greater than the published Chrome "
                  f"Web Store version {published}. Bump apps/caramel-extension "
                  "manifest.json (and the matching version fields) before tagging."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\nChrome Web Store published version: `{published}` → releasing `{manifest}`\n")
          PY

  package:
    name: '📦 Package Extension'
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ github.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: pnpm run package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: ${{ env.WORKING_DIRECTORY }}/extension.zip

      # Firefox ships the SAME built dist/ as Chrome — one manifest is the only
      # difference (MV3 `background.scripts` instead of a service worker, the
      # gecko id, and no `identity` permission; see popup.js's Firefox OAuth
      # note). scripts/build-dist.mjs deliberately keeps manifest-firefox.json
      # OUT of dist/ (it is in that file's NEVER_SHIP list), so the Firefox
      # package is dist/ with that manifest copied over manifest.json. The
      # Chrome build and zip above are not touched.
      - name: Package extension for Firefox
        run: |
          set -euo pipefail
          rm -rf dist-firefox
          cp -r dist dist-firefox
          cp manifest-firefox.json dist-firefox/manifest.json
          # Assert the swap actually landed rather than trusting cp: a Firefox
          # package carrying Chrome's manifest would be rejected by AMO only
          # after the upload, and one still carrying manifest-firefox.json
          # alongside would ship a file the allowlist says never ships.
          jq -er '.browser_specific_settings.gecko.id' dist-firefox/manifest.json
          test ! -e dist-firefox/manifest-firefox.json

      # A directory, not a zip: `web-ext sign` takes --source-dir and builds the
      # xpi itself (it hashes that build to decide whether to re-upload), so
      # handing it a zip would only mean unzipping it again in publish_firefox.
      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: ${{ env.WORKING_DIRECTORY }}/dist-firefox
          if-no-files-found: error

  publish_chrome:
    name: '🚀 Publish to Chrome Web Store'
    needs: [guard, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: .

      - name: Upload to Chrome Web Store (upload-only)
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: false

      - name: Note that the upload is a draft
        run: |
          {
            echo "### Chrome Web Store"
            echo ""
            echo "Version \`${{ needs.guard.outputs.version }}\` was uploaded as a **draft** (\`publish: false\`)."
            echo "**Manual publish required** — open the Chrome Web Store developer dashboard and submit it for review."
            echo "Until that happens the store keeps serving the previous version, and the next release's freeze-guard will still compare against the old one."
          } >> "$GITHUB_STEP_SUMMARY"

  publish_firefox:
    name: '🚀 Publish to Firefox Add-ons (AMO)'
    needs: [guard, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      # 'true' only when the run actually submitted to AMO. The GitHub Release
      # body reads this so it never claims a Firefox release that did not happen.
      submitted: ${{ steps.credentials.outputs.configured }}
    steps:
      # THE GATE. `secrets` is not available in a job-level `if:` (only github,
      # needs, vars and inputs are), so the skip is a first step that publishes
      # a boolean every later step keys off. The job still ends GREEN when the
      # secrets are absent — that is the point: an unconfigured Firefox leg must
      # never redden a Chrome/Safari release — but it is impossible to miss,
      # because it writes both an annotation and a run-summary block.
      #
      # What it deliberately does NOT do: guess, retry, or continue with empty
      # credentials. Every publishing step below is gated on configured=true.
      - name: Detect AMO credentials
        id: credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          missing=""
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            # `${!name:-}`, not `${!name}`: indirect expansion of a genuinely
            # unset variable aborts under `set -u`, which would fail this job —
            # the exact outcome this step exists to prevent. GitHub does define
            # a declared env var as an empty string when its secret is missing,
            # but the whole point here is not to bet the skip path on that.
            if [ -z "${!name:-}" ]; then
              missing="${missing:+${missing}, }${name}"
            fi
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AMO credentials present — the Firefox submission will run."
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Firefox was NOT published to addons.mozilla.org: repository secret(s) ${missing} are unset, so this run cannot authenticate to AMO. Chrome and Safari were unaffected."
          {
            echo "### Firefox Add-ons (AMO) — NOT PUBLISHED"
            echo ""
            echo "Version \`${RELEASE_VERSION}\` was **not** submitted to addons.mozilla.org."
            echo ""
            echo "Why: repository secret(s) **${missing}** are unset, so nothing could authenticate to the AMO API."
            echo "Firefox users stay on whatever version the listing already serves; Chrome and Safari were unaffected by this."
            echo ""
            echo "To activate this job, create both secrets from an AMO API key pair"
            echo "(<https://addons.mozilla.org/en-US/developers/addon/api/key/>) and re-run the release:"
            echo ""
            echo "- \`AMO_JWT_ISSUER\` — the key pair's *JWT issuer*"
            echo "- \`AMO_JWT_SECRET\` — the key pair's *JWT secret* (shown only once at creation)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Same doctrine as "Assert Chrome Web Store credentials are live": prove
      # the credentials work BEFORE uploading anything, so a revoked or mistyped
      # key surfaces here instead of somewhere inside web-ext's upload.
      #
      # An AMO API key is a JWT issuer/secret pair, not a bearer token — the API
      # wants a short-lived HS256 token signed with the secret (AMO caps its
      # lifetime at 5 minutes; 60s is plenty). accounts/profile is the cheapest
      # authenticated read there is: it answers 401 both unauthenticated and
      # with a bad token, so a 200 is real proof the pair is live.
      - name: Assert AMO credentials are live
        if: steps.credentials.outputs.configured == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          token=$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import time


          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=")


          now = int(time.time())
          header = b64(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64(
              json.dumps(
                  {
                      "iss": os.environ["AMO_JWT_ISSUER"],
                      "jti": secrets.token_hex(16),
                      "iat": now,
                      "exp": now + 60,
                  },
                  separators=(",", ":"),
              ).encode()
          )
          signing_input = header + b"." + payload
          signature = b64(hmac.new(os.environ["AMO_JWT_SECRET"].encode(), signing_input, hashlib.sha256).digest())
          print((signing_input + b"." + signature).decode())
          PY
          )
          # The token is derived from a secret, so it is not masked automatically.
          echo "::add-mask::${token}"

          http=$(curl -sS -o /tmp/amo-profile.json -w '%{http_code}' \
            -H "Authorization: JWT ${token}" \
            "https://addons.mozilla.org/api/v5/accounts/profile/")
          if [ "$http" != "200" ]; then
            echo "::error::addons.mozilla.org accounts/profile returned HTTP $http — the AMO API key pair is wrong, revoked or expired."
            cat /tmp/amo-profile.json
            exit 1
          fi
          echo "AMO credentials verified as $(jq -er '.username' /tmp/amo-profile.json)."

      # FREEZE-GUARD — refuse to ship a version AMO already lists.
      #
      # The add-on slug `grabcaramel` is PUBLIC (it is literally the store URL,
      # https://addons.mozilla.org/en-US/firefox/addon/grabcaramel/), not a
      # secret, so this read needs no authentication and no extra repository
      # variable. `current_version.version` is the version AMO currently serves
      # to installed users; the job fails unless the manifest version is
      # strictly greater.
      #
      # It lives HERE, not in the guard job, on purpose: an AMO-side freeze must
      # not be able to fail a Chrome/Safari release, and it is meaningless on a
      # run that is skipping Firefox anyway.
      #
      # NOT guaranteed by this guard:
      #   * A version already submitted and awaiting Mozilla review is invisible
      #     — the listing keeps reporting the approved one, so two tags pushed
      #     back to back can both pass (the Chrome guard has the same blind
      #     spot, for the same reason).
      #   * Unlisted/self-distributed versions are not represented here at all.
      #   * A delisted or disabled add-on makes the endpoint 404, which fails
      #     the job rather than passing an unverifiable release.
      # Any transport error, unparseable body, missing field or non-numeric
      # version is a hard failure: this guard never degrades to a pass.
      - name: AMO publish freeze-guard
        if: steps.credentials.outputs.configured == 'true'
        env:
          MANIFEST_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -o /tmp/amo-addon.json \
            -H 'Accept: application/json' \
            "https://addons.mozilla.org/api/v5/addons/addon/grabcaramel/"
          python3 - <<'PY'
          import json
          import os
          import sys


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          def parse(version, label):
              parts = version.split(".")
              if not all(part.isdigit() for part in parts):
                  fail(f"{label} version {version!r} is not numeric-dotted; cannot compare.")
              return [int(part) for part in parts]


          try:
              with open("/tmp/amo-addon.json", encoding="utf-8") as handle:
                  addon = json.load(handle)
          except (OSError, ValueError) as exc:
              fail(f"addons.mozilla.org returned an unreadable add-on detail response: {exc}")

          listed = (addon.get("current_version") or {}).get("version")
          if not listed:
              fail(
                  "addons.mozilla.org add-on detail carried no current_version.version. "
                  "Either the slug is wrong or the listing has no approved version, so "
                  "the published version cannot be verified."
              )

          manifest = os.environ["MANIFEST_VERSION"]
          listed_parts = parse(listed, "listed")
          manifest_parts = parse(manifest, "manifest")
          width = max(len(listed_parts), len(manifest_parts))
          listed_parts += [0] * (width - len(listed_parts))
          manifest_parts += [0] * (width - len(manifest_parts))

          print(f"AMO currently lists {listed}; manifest is {manifest}")
          if manifest_parts <= listed_parts:
              fail(
                  f"Manifest version {manifest} is not greater than the version "
                  f"addons.mozilla.org already lists ({listed}). Bump "
                  "apps/caramel-extension manifest.json (and the matching version "
                  "fields) before tagging."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\nAMO listed version: `{listed}` → submitting `{manifest}`\n")
          PY

      # Checkout before download-artifact, never after: actions/checkout cleans
      # the workspace and would delete a downloaded artifact. Nothing is rebuilt
      # here — the checkout exists so the web-ext version comes from the repo's
      # own pin instead of a second copy of the number living in this file.
      - name: Checkout code
        uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'

      - name: Resolve the pinned web-ext version
        id: webext
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          version=$(jq -er '.devDependencies["web-ext"]' "${WORKING_DIRECTORY}/package.json")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::web-ext is pinned as '$version' in ${WORKING_DIRECTORY}/package.json — an exact X.Y.Z pin is required (no ranges, no @latest)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Signing with web-ext@$version (pinned by the extension package)."

      - name: Download Firefox build artifact
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-firefox
          path: firefox-src

      - name: Setup Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--channel=listed` submits the version to the public AMO listing, which
      # is what the 829 daily users on that listing actually receive.
      #
      # `--approval-timeout=0` is load-bearing, not a shortcut: by default
      # web-ext waits for the version to be APPROVED and then downloads the
      # signed xpi. Listed submissions go to human review at Mozilla, which
      # takes hours to days, so the default would time out and paint a
      # perfectly successful submission red. What is NOT skipped is AMO's
      # automated validation — web-ext still waits for it and throws (non-zero
      # exit) when it fails, so a broken package is still a red job.
      #
      # Credentials go through WEB_EXT_API_KEY/WEB_EXT_API_SECRET (web-ext maps
      # WEB_EXT_* env vars onto the current command's options) rather than CLI
      # flags, so they never appear in a process command line.
      - name: Sign and submit to addons.mozilla.org
        if: steps.credentials.outputs.configured == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_VERSION: ${{ steps.webext.outputs.version }}
        run: |
          set -euo pipefail
          npx --yes "web-ext@${WEB_EXT_VERSION}" sign \
            --source-dir=firefox-src \
            --artifacts-dir=firefox-artifacts \
            --channel=listed \
            --approval-timeout=0

      - name: Note that the version is queued for Mozilla review
        if: steps.credentials.outputs.configured == 'true'
        run: |
          {
            echo "### Firefox Add-ons (AMO)"
            echo ""
            echo "Version \`${{ needs.guard.outputs.version }}\` was **submitted** to the \`listed\` channel of <https://addons.mozilla.org/en-US/firefox/addon/grabcaramel/>."
            echo "No manual upload is needed — but **Mozilla review still gates it**: until the version is approved the listing keeps serving the previous one, and the next release's freeze-guard will still compare against that older version."
          } >> "$GITHUB_STEP_SUMMARY"

  publish_edge:
    name: '🚀 Publish to Microsoft Edge Add-ons'
    needs: [guard, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      # 'true' only when the run actually submitted to Edge. The GitHub Release
      # body reads this so it never claims an Edge release that did not happen.
      submitted: ${{ steps.credentials.outputs.configured }}
    steps:
      # THE GATE — identical doctrine to publish_firefox. `secrets` cannot be
      # read in a job-level `if:`, so the skip is a first step that publishes a
      # boolean every later step keys off. The job ends GREEN when the secrets
      # are absent — an unconfigured Edge leg must never redden a
      # Chrome/Firefox/Safari release — but it writes both an annotation and a
      # run-summary block so it is impossible to miss. It never guesses, retries,
      # or continues with empty credentials.
      #
      # The three secrets come from Partner Center's "Publish API" page
      # (Create API credentials → Client ID + API key) plus the add-on's Product
      # ID from its Edge Add-ons dashboard:
      #   EDGE_PRODUCT_ID  — the add-on Product ID
      #   EDGE_CLIENT_ID   — the Publish API v1.1 client id
      #   EDGE_API_KEY     — the Publish API v1.1 key (shown once at creation)
      # Registering the item once in Partner Center to obtain the Product ID is
      # the only human step; Edge developer registration and publishing are free.
      - name: Detect Edge credentials
        id: credentials
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          missing=""
          for name in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
            # `${!name:-}`, not `${!name}`: indirect expansion of a genuinely
            # unset variable aborts under `set -u`, which would fail this job —
            # the exact outcome this gate exists to prevent.
            if [ -z "${!name:-}" ]; then
              missing="${missing:+${missing}, }${name}"
            fi
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Edge credentials present — the Edge submission will run."
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Microsoft Edge Add-ons was NOT published: repository secret(s) ${missing} are unset, so this run cannot authenticate to the Edge Publish API. Chrome, Firefox and Safari were unaffected."
          {
            echo "### Microsoft Edge Add-ons — NOT PUBLISHED"
            echo ""
            echo "Version \`${RELEASE_VERSION}\` was **not** submitted to Microsoft Edge Add-ons."
            echo ""
            echo "Why: repository secret(s) **${missing}** are unset, so nothing could authenticate to the Edge Publish API."
            echo "Edge users stay on whatever the listing already serves (or install the Chrome Web Store build directly); Chrome, Firefox and Safari were unaffected."
            echo ""
            echo "To activate this job, register the add-on once in Partner Center, then create these repository secrets and re-run the release:"
            echo ""
            echo "- \`EDGE_PRODUCT_ID\` — the add-on Product ID (Partner Center dashboard)"
            echo "- \`EDGE_CLIENT_ID\` — the Publish API *Client ID* (Partner Center → Publish API → Create API credentials)"
            echo "- \`EDGE_API_KEY\` — the Publish API *key* (shown only once at creation)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Edge is Chromium: the SAME extension.zip Chrome uploads (the standard
      # manifest.json, `identity` permission and all) is exactly what Edge wants
      # — no Firefox-style manifest swap. So this leg consumes the `package`
      # job's `extension-package` artifact untouched, and Edge's popup OAuth
      # works through chrome.identity just like Chrome's.
      - name: Download artifact
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: .

      # FREEZE-GUARD GAP (deliberate, documented): unlike the Chrome and AMO
      # legs there is no unauthenticated public read mapping our Product ID to
      # the version Edge currently serves — the public getproductdetailsbycrxid
      # endpoint keys off the CRX id, which differs from the submission Product
      # ID we hold. The Edge Publish API itself rejects re-publishing an
      # unchanged/older package with a non-zero error, so the action below fails
      # loudly rather than mis-publishing; a pre-flight "manifest > live" guard
      # like the other two stores is a TODO once a Product-ID→version read
      # exists.
      #
      # wdzeng/edge-addon is pinned to a full commit SHA (not a moving tag)
      # because it handles publish credentials. It authenticates with the v1.1
      # API key + client id, uploads the package, and — upload-only unset —
      # submits it for Microsoft certification. It exits non-zero on any
      # auth/upload/publish error, so it never degrades to a silent pass.
      - name: Publish to Microsoft Edge Add-ons
        if: steps.credentials.outputs.configured == 'true'
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: extension.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

      - name: Note that the version is queued for Microsoft certification
        if: steps.credentials.outputs.configured == 'true'
        run: |
          {
            echo "### Microsoft Edge Add-ons"
            echo ""
            echo "Version \`${{ needs.guard.outputs.version }}\` was **submitted** to Microsoft Edge Add-ons."
            echo "No manual upload is needed — but **Microsoft certification still gates it**: until it passes, the listing keeps serving the previous version."
          } >> "$GITHUB_STEP_SUMMARY"

  publish_safari:
    name: '🚀 Publish to Apple App Store (Safari & iOS)'
    needs: [guard, package]
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: ${{ env.WORKING_DIRECTORY }}
      - name: Unzip extension
        run: unzip -q extension.zip
      - name: Install ImageMagick and jq
        run: |
          if ! command -v convert >/dev/null 2>&1; then brew install imagemagick; fi
          if ! command -v jq      >/dev/null 2>&1; then brew install jq; fi
      - name: Setup temporary scripts directory
        run: |
          mkdir -p /tmp/safari-icon-scripts
          cp ${{ github.workspace }}/.github/workflows/scripts/generate-safari-icons.sh /tmp/safari-icon-scripts/
          cp ${{ github.workspace }}/.github/workflows/scripts/update-safari-icons.sh   /tmp/safari-icon-scripts/
          chmod +x /tmp/safari-icon-scripts/*.sh
      - name: Generate Safari icons
        run: /tmp/safari-icon-scripts/generate-safari-icons.sh icons/original.png
      - name: Install App Store Connect API key
        run: |
          echo "${ASC_API_KEY_BASE64}" | base64 --decode > "/tmp/AuthKey_${ASC_KEY_ID}.p8"
          ls -l "/tmp/AuthKey_${ASC_KEY_ID}.p8"
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      # `brew trust` is required since Homebrew started refusing --HEAD
      # formulae from third-party taps: on 2026-07-13 this step failed with
      # "Refusing to load formula ittybittyapps/appstoreconnect-cli/... from
      # untrusted tap", which took the whole Safari/iOS release down. The trust
      # call is the remedy Homebrew's own error message prescribes.
      #
      # --HEAD cannot be dropped: the tap's only formula
      # (ittybittyapps/homebrew-appstoreconnect-cli @ appstoreconnect-cli.rb)
      # declares a `head` block and NO stable `url`/`version`, so there is no
      # released version to install. What we can pin is the formula itself, so
      # a future tap edit cannot silently change what gets built — the tap
      # checkout is reset to a fixed commit before install.
      # Residual, deliberately accepted gap: the formula's `head` still tracks
      # the upstream `master` branch, so the compiled source is not pinned.
      # Both repos have been dormant for years (tap last touched 2020-04-23,
      # upstream 2022-10-31), which is why this is a documented risk rather
      # than a blocker. The real fix is vendoring a formula with a pinned
      # `url`+`revision`, or replacing `asc` with a direct App Store Connect
      # API call — neither is in scope for this change.
      - name: Install App Store Connect CLI
        env:
          # Tip of ittybittyapps/homebrew-appstoreconnect-cli @ 2020-04-23.
          ASC_TAP_COMMIT: a465653f2156ba7079a79b149a4078dfaea96f8e
        run: |
          set -euo pipefail
          brew tap ittybittyapps/appstoreconnect-cli
          tap_repo="$(brew --repo ittybittyapps/appstoreconnect-cli)"
          git -C "$tap_repo" fetch --depth 1 origin "$ASC_TAP_COMMIT"
          git -C "$tap_repo" checkout --detach "$ASC_TAP_COMMIT"
          echo "Pinned tap to $(git -C "$tap_repo" rev-parse HEAD)"
          brew trust ittybittyapps/appstoreconnect-cli
          brew install --HEAD appstoreconnect-cli
      # The marketing version is NOT derived here any more — it is the manifest
      # version resolved by the guard job. TestFlight is queried for one thing
      # only: the highest existing build number, so the new upload gets +1.
      - name: Get next TestFlight build numbers for macOS and iOS
        id: get_versions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          SAFARI_BUNDLE_ID: ${{ env.SAFARI_BUNDLE_ID }}
        run: |
          mkdir -p private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > private_keys/AuthKey_$ASC_KEY_ID.p8
          export APPSTORE_CONNECT_API_KEY_ID="$ASC_KEY_ID"
          export APPSTORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APPSTORE_CONNECT_API_KEY="$(cat private_keys/AuthKey_${ASC_KEY_ID}.p8)"

          # --limit 50 is the max the ASC API allows for sub-resources
          asc testflight builds list \
            --filter-bundle-ids "$SAFARI_BUNDLE_ID" \
            --include-expired --limit 50 \
            --api-key-id "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --json > builds.json || true

          echo "=== RAW builds.json ==="
          cat builds.json

          mac_entry=$(jq '[.[] | select(.platform=="MAC_OS")] | sort_by(.buildNumber | tonumber) | .[-1]' builds.json)
          ios_entry=$(jq '[.[] | select(.platform=="IOS")]   | sort_by(.buildNumber | tonumber) | .[-1]' builds.json)

          echo "=== mac_entry ===" ; echo "$mac_entry"
          echo "=== ios_entry ===" ; echo "$ios_entry"

          # Fail loudly if either entry is missing — avoids silent wrong-build-number uploads
          if [ "$(echo "$mac_entry" | jq -r 'type')" = "null" ]; then
            echo "ERROR: Could not determine current macOS build from TestFlight. Aborting."
            exit 1
          fi
          if [ "$(echo "$ios_entry" | jq -r 'type')" = "null" ]; then
            echo "ERROR: Could not determine current iOS build from TestFlight. Aborting."
            exit 1
          fi

          MACOS_CURRENT_BUILD=$( echo "$mac_entry" | jq -r '.buildNumber // "1"' )
          IOS_CURRENT_BUILD=$( echo "$ios_entry" | jq -r '.buildNumber // "1"' )

          echo "macOS current build: $MACOS_CURRENT_BUILD"
          echo "iOS   current build: $IOS_CURRENT_BUILD"

          echo "IOS_BUILD_NUM=$((IOS_CURRENT_BUILD+1))"     >> $GITHUB_ENV
          echo "MACOS_BUILD_NUM=$((MACOS_CURRENT_BUILD+1))" >> $GITHUB_ENV

      - name: Import distribution cert
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Import development cert
        uses: apple-actions/import-codesign-certs@v2
        with:
          create-keychain: false
          keychain: signing_temp
          p12-file-base64: ${{ secrets.APPLE_DEV_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Convert to Safari app (macOS & iOS)
        run: |
          xcrun safari-web-extension-converter dist \
            --project-location SafariExtProject \
            --app-name "${{ env.APP_NAME }}" \
            --bundle-identifier "${SAFARI_BUNDLE_ID}" \
            --no-open --no-prompt --force --copy-resources

      - name: Update Safari icons
        run: /tmp/safari-icon-scripts/update-safari-icons.sh SafariExtProject/${{ env.APP_NAME }} safari-icons

      - name: Clean up script files from project
        run: find SafariExtProject -name "*.sh" -delete

      - name: Patch macOS Info.plist LSApplicationCategoryType
        run: |
          find SafariExtProject/${{ env.APP_NAME }} -name Info.plist -print0 | \
          while IFS= read -r -d '' plist; do
            /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string ${MAC_CATEGORY}" "$plist" \
              2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType ${MAC_CATEGORY}" "$plist"
          done

      - name: Build & archive (macOS)
        run: |
          xcodebuild archive \
            -project SafariExtProject/${{ env.APP_NAME }}/${{ env.APP_NAME }}.xcodeproj \
            -scheme "${{ env.APP_NAME }} (macOS)" \
            -configuration Release \
            -archivePath SafariExtProject/${{ env.APP_NAME }}-macos.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${{ env.MACOS_BUILD_NUM }}" \
            ARCHS="arm64 x86_64" \
            VALID_ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Build & archive (iOS)
        run: |
          xcodebuild archive \
            -project SafariExtProject/${{ env.APP_NAME }}/${{ env.APP_NAME }}.xcodeproj \
            -scheme "${{ env.APP_NAME }} (iOS)" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath SafariExtProject/${{ env.APP_NAME }}-ios.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${{ env.IOS_BUILD_NUM }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Write exportOptions (macOS)
        run: |
          cat > /tmp/exportOptionsMac.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Write exportOptions (iOS)
        run: |
          cat > /tmp/exportOptionsIOS.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Export (macOS)
        run: |
          xcodebuild -exportArchive \
            -archivePath SafariExtProject/${{ env.APP_NAME }}-macos.xcarchive \
            -exportOptionsPlist /tmp/exportOptionsMac.plist \
            -exportPath SafariExtProject/Exported-macos \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Export (iOS)
        run: |
          xcodebuild -exportArchive \
            -archivePath SafariExtProject/${{ env.APP_NAME }}-ios.xcarchive \
            -exportOptionsPlist /tmp/exportOptionsIOS.plist \
            -exportPath SafariExtProject/Exported-ios \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload macOS pkg to App Store Connect
        env:
          ALTOOL_USER: ${{ secrets.APPLE_ID }}
          ALTOOL_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f SafariExtProject/Exported-macos/${{ env.APP_NAME }}.pkg \
            -t osx -u "$ALTOOL_USER" -p "$ALTOOL_PASSWORD" --verbose

      - name: Upload iOS ipa to App Store Connect
        env:
          ALTOOL_USER: ${{ secrets.APPLE_ID }}
          ALTOOL_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f SafariExtProject/Exported-ios/${{ env.APP_NAME }}.ipa \
            -t ios -u "$ALTOOL_USER" -p "$ALTOOL_PASSWORD" --verbose

      - name: Note that the builds land in TestFlight
        run: |
          {
            echo "### Apple App Store (Safari & iOS)"
            echo ""
            echo "Marketing version \`${RELEASE_VERSION}\` uploaded — macOS build \`${MACOS_BUILD_NUM}\`, iOS build \`${IOS_BUILD_NUM}\`."
            echo "These land in **TestFlight** after Apple finishes processing."
            echo "**Manual submit required** — App Store Connect still needs a version created and submitted for review before customers get it."
          } >> "$GITHUB_STEP_SUMMARY"

  github_release:
    name: '🏷️ Publish GitHub Release'
    needs:
      [
        guard,
        package,
        publish_chrome,
        publish_firefox,
        publish_safari,
        publish_edge,
      ]
    if: ${{ !inputs.dry_run && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Extension ${{ needs.guard.outputs.version }}
          files: extension.zip
          fail_on_unmatched_files: true
          body: |
            Extension version `${{ needs.guard.outputs.version }}` built from `${{ github.sha }}`.

            Store state at release time:

            - **Chrome Web Store** — uploaded as a draft, manual publish required.
            - **Apple App Store** — uploaded to TestFlight, manual submit required.
            - **Firefox / AMO** — ${{ needs.publish_firefox.outputs.submitted == 'true' && 'submitted to the listed channel, awaiting Mozilla review.' || 'NOT published — the AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets are unset (see the run summary and the header of `.github/workflows/release-extension.yml`).' }}
            - **Microsoft Edge Add-ons** — ${{ needs.publish_edge.outputs.submitted == 'true' && 'submitted to Edge, awaiting Microsoft certification.' || 'NOT published — the EDGE_PRODUCT_ID / EDGE_CLIENT_ID / EDGE_API_KEY repository secrets are unset (see the run summary and the header of `.github/workflows/release-extension.yml`).' }}
