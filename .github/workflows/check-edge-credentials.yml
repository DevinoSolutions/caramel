name: Check – Edge Publish API credentials

# Proves the Edge Add-ons Publish API secrets authenticate WITHOUT publishing
# anything. The release workflow's Edge leg is the only other consumer, and the
# dry_run dispatch skips it, so a renewed EDGE_API_KEY (Partner Center keys
# expire) would otherwise first be tested by a real v* release.
#
# One read-only call: the status of a package-upload operation that cannot
# exist (the all-zero GUID). Valid credentials get 404 (no such operation);
# a bad key or client id gets 401/403. Nothing is uploaded or submitted, and
# no secret is printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: '🔑 Edge Publish API credentials authenticate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call a read-only Edge Publish API endpoint
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          for name in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::repository secret ${name} is unset"
              exit 1
            fi
          done

          # A secret pasted with a trailing newline or space makes the API answer
          # 400 "Authorization header is malformed". Report that shape (lengths
          # only, never the value) so a bad paste is told apart from a bad key,
          # then call with the whitespace stripped.
          for name in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
            raw="${!name}"
            trimmed="$(printf '%s' "$raw" | tr -d '[:space:]')"
            if [ "${#raw}" -ne "${#trimmed}" ]; then
              echo "::warning::secret ${name} contains $(( ${#raw} - ${#trimmed} )) whitespace character(s); re-save it without them (the release's Edge leg sends it as-is)."
            fi
            printf -v "$name" '%s' "$trimmed"
          done

          url="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/00000000-0000-0000-0000-000000000000"
          code=$(curl -sS -o /tmp/edge-body -w '%{http_code}' \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            "$url")
          echo "Edge Publish API answered HTTP ${code} (whitespace-stripped credentials)"

          case "$code" in
            404)
              echo "### Edge Publish API credentials: OK" >> "$GITHUB_STEP_SUMMARY"
              echo "HTTP 404 for a non-existent operation, so the key and client id authenticate." >> "$GITHUB_STEP_SUMMARY"
              ;;
            401|403)
              echo "::error::Edge Publish API rejected the credentials (HTTP ${code}). Renew EDGE_API_KEY / check EDGE_CLIENT_ID in Partner Center."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${code} from the Edge Publish API; credentials not proven."
              head -c 300 /tmp/edge-body || true
              exit 1
              ;;
          esac
