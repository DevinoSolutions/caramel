name: CI Checks – App

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Nightly re-audit of prod deps so a new CVE on an unchanged pin surfaces
    # even with no push. Only the `audit` job runs on this trigger.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Code Quality Checks (lint, prettier, typecheck, knip)
  # ─────────────────────────────────────────────────────────────
  test-matrix:
    name: ${{ matrix.task }}
    # Schedule runs the nightly dependency audit only — skip the quality matrix.
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        task:
          [
            'lint',
            'prettier',
            'typecheck',
            'knip',
            'unit',
            'oxlint',
            'prettier-root',
          ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dependencies
        run: pnpm doctor

      # Prisma client for typecheck + unit. Since W4 the coupon unit tests
      # import @prisma/client (the `Prisma` namespace — Prisma.sql/Prisma.join)
      # through the couponsRepo read layer, so the `unit` job needs the generated
      # client present too or collection fails with "Cannot find module
      # '.prisma/client/default'". (integration/e2e jobs generate explicitly.)
      - if: matrix.task == 'typecheck' || matrix.task == 'unit'
        name: Generate Prisma Client
        run: pnpm --filter caramel-app exec prisma generate

      # oxlint runs from the repo root (both apps), not per-app like the rest
      # of this matrix — kept in the same matrix so it reports as its own
      # "oxlint" status check, sibling to lint/prettier/typecheck/knip.
      - if: matrix.task == 'oxlint'
        name: Run oxlint
        run: pnpm lint:oxlint

      # prettier-root checks repo-root + .github files (workflows YAML, root
      # package.json, README, issue templates) that the per-app prettier task
      # doesn't cover — runs from the repo root, like oxlint.
      - if: matrix.task == 'prettier-root'
        name: Run root prettier-check
        run: pnpm prettier-check:root

      - if: matrix.task != 'oxlint' && matrix.task != 'prettier-root'
        name: Run ${{ matrix.task }}
        working-directory: ./apps/caramel-app
        run: |
          case ${{ matrix.task }} in
            lint)      pnpm lint ;;
            prettier)  pnpm prettier-check ;;
            typecheck) pnpm tsc --noEmit ;;
            knip)      pnpm knip ;;
            unit)      pnpm test ;;
          esac

  # ─────────────────────────────────────────────────────────────
  # Integration (W1) — real prisma against a live Postgres
  # ─────────────────────────────────────────────────────────────
  # The unit job (test-matrix) mocks prisma; this is its DB-backed sibling:
  # tests/integration/**/*.itest.ts run the real prisma client against a live
  # Postgres so the coupon_signals read/write path is exercised for real, not
  # mocked. Same trigger as test-matrix (PR + push, not the nightly audit) so a
  # regression is caught on every change, not just on PRs.
  integration:
    name: Integration (DB)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Prod-matching: docker-compose.yml pins postgres:18.4. (The e2e-pr
        # job's postgres:15 is a separate, known pin-drift punch-list item —
        # deliberately NOT copied here.)
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caramel
        ports: ['58005:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d caramel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes apps/caramel-app/.env with a DATABASE_URL pointing at the
      # postgres service (postgres:postgres@localhost:58005/caramel) — the same
      # value vitest.integration.config.ts's loadEnvFile('.env') reads.
      - name: Write minimal CI env
        run: pnpm --filter caramel-app run setup:ci-env

      - name: Generate Prisma Client
        run: pnpm --filter caramel-app exec prisma generate

      - name: Apply Prisma migrations
        working-directory: ./apps/caramel-app
        run: pnpm exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm --filter caramel-app test:integration

  # ─────────────────────────────────────────────────────────────
  # Dependency Vulnerability Audit (prod deps, high + critical)
  # ─────────────────────────────────────────────────────────────
  # FLAG-02: `pnpm audit` calls npm's retired quick-audit endpoint (HTTP 410 on
  # pnpm 9 and 10), so it reddened on the transport, never on a real advisory.
  # Replaced by a prod-scoped OSV.dev gate that keeps the same contract:
  # production closure only (`pnpm -r list --prod`), fail on HIGH/CRITICAL.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (high + critical)
        run: pnpm --filter caramel-app run audit:prod

  # ─────────────────────────────────────────────────────────────
  # Schema Drift Check (every PR — there is no path filter)
  # ─────────────────────────────────────────────────────────────
  # This job was DECORATIVE until 2026-08-10: every check ended in
  # `--exit-code || echo "No drift detected"`, so the `||` turned a real failure
  # into a reassuring log line and the job was green no matter what the checks
  # found. It was also failing all three checks in a row, invisibly, because the
  # shadow "database" was a shadow SCHEMA (see the SHADOW_DATABASE_URL note).
  # Rule: no `|| echo` in this job. A check that cannot go red is not a gate.
  schema-drift:
    name: Schema Drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        # Prod-matching: docker-compose.yml pins postgres:18.4, and a *drift*
        # gate measuring against a different engine version is measuring the
        # wrong database. (The e2e-pr job's postgres:15 stays a separate
        # punch-list item.)
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caramel_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/caramel_ci'
      # A dedicated shadow DATABASE, never a shadow SCHEMA. Under
      # `?schema=__shadow` the migration history genuinely cannot replay: the
      # older migrations create unqualified tables (which land in __shadow)
      # while the newer, newer-Prisma ones emit `"public"."…"`-qualified DDL, so
      # the first public-qualified FK to an older table dies with
      # P3006 / P1014 "the underlying table for model `public.users` does not
      # exist". The partial replay then leaves objects behind in caramel_ci,
      # which made the following `migrate deploy` fail P3005 ("database schema
      # is not empty") and left the last check diffing against an empty public
      # schema. A separate database replays the identical history clean.
      SHADOW_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/caramel_ci_shadow'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: ${{ runner.os }}-prisma-engines-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prisma-engines-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        working-directory: ./apps/caramel-app
        run: npx prisma validate

      # Prisma resets this database itself before each replay, so the two drift
      # checks below can share it; it only has to exist.
      - name: Create shadow database
        run: |
          set -euo pipefail
          sudo apt-get -yqq install postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -c "DROP DATABASE IF EXISTS caramel_ci_shadow;"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -c "CREATE DATABASE caramel_ci_shadow;"

      # Replays every migration into the shadow database and diffs the result
      # against schema.prisma. Exit 2 = a schema.prisma change shipped without
      # its migration (or a hand-edited migration). It fails the job.
      - name: Drift check (schema ⇄ migrations)
        working-directory: ./apps/caramel-app
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # A migration that does not apply to an empty database is a broken
      # migration, so this failing must fail the job.
      - name: Apply migrations
        working-directory: ./apps/caramel-app
        run: npx prisma migrate deploy

      - name: Drift check (migrations ⇄ Postgres)
        working-directory: ./apps/caramel-app
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-url "$DATABASE_URL" \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  # ─────────────────────────────────────────────────────────────
  # E2E & Visual Regression (PR – local dev server)
  # ─────────────────────────────────────────────────────────────
  e2e-pr:
    name: E2E & Visual Regression (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Raised from 15: support-flow.spec.ts verifies REAL PostHog ingestion, and
    # the shared self-hosted PostHog's ingestion lag can spike to ~340s per
    # ingestion test (they run serially here — workers=1 in CI).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caramel
        ports: ['58005:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d caramel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter caramel-app exec playwright install --with-deps chromium

      - name: Write minimal CI env
        run: pnpm --filter caramel-app run setup:ci-env

      - name: Generate Prisma Client
        run: pnpm --filter caramel-app exec prisma generate

      - name: Apply Prisma migrations
        working-directory: ./apps/caramel-app
        run: pnpm exec prisma migrate deploy

      - name: Run E2E tests
        working-directory: ./apps/caramel-app
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:58000
          NEXT_PUBLIC_BASE_URL: http://localhost:58000
          PLAYWRIGHT_WEB_COMMAND: pnpm dev
          PLAYWRIGHT_START_SERVER: 'true'
          PLAYWRIGHT_WEB_TIMEOUT: '300000'
          # PostHog REAL-INGESTION verification (support-flow.spec.ts). The app
          # server (next dev, launched by Playwright's webServer) and the
          # Playwright runner share this step's env. CRITICAL: env.ts fail-fasts
          # at BOOT if the read-only Query key is present in an app/server env,
          # so playwright.config.ts blanks POSTHOG_E2E_TEST_PROJECT_QUERY_READ_
          # ONLY_PERSONAL_API_KEY in its webServer.env for the app process ONLY
          # (Playwright merges { ...process.env, ...webServer.env }, and '' is
          # falsy so the guard passes). The Playwright process keeps the real
          # value — e2e/support/posthog.ts uses it to poll the PostHog Query API.
          # Dataset=e2e routes captures to the isolated shared test project.
          POSTHOG_DATASET: e2e
          NEXT_PUBLIC_POSTHOG_DATASET: e2e
          NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST }}
          NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN }}
          POSTHOG_E2E_TEST_PROJECT_ID: ${{ secrets.POSTHOG_E2E_TEST_PROJECT_ID }}
          POSTHOG_E2E_TEST_PROJECT_QUERY_READ_ONLY_PERSONAL_API_KEY: ${{ secrets.POSTHOG_E2E_TEST_PROJECT_QUERY_READ_ONLY_PERSONAL_API_KEY }}
        run: pnpm test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr
          path: apps/caramel-app/playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # E2E & Visual Regression (push – deployed site baseline)
  # ─────────────────────────────────────────────────────────────
  e2e-push:
    name: E2E & Visual Regression (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 20 of these belong to the deploy gate below, which waits out a full
    # Dokploy Docker build before a single test runs; the rest is the old
    # budget. 20 rather than 10 is measured: on 2026-08-07 a three-push burst
    # queued builds back-to-back and 0a57362's deploy was still building when
    # the 10-minute window closed — the gate refused correctly, but the red
    # was queue latency, not a defect.
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev.grabcaramel.com' || 'https://grabcaramel.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter caramel-app exec playwright install --with-deps chromium

      # NOTE: the PostHog real-ingestion env is deliberately NOT set here yet.
      # The deployed dev site does not have PostHog baked into its bundle until
      # this branch merges + redeploys, so support-flow.spec.ts's ingestion
      # tests SKIP themselves against the deployed site (no DATABASE_URL, and the
      # verification creds are absent). TODO: once dev.grabcaramel.com ships with
      # NEXT_PUBLIC_POSTHOG_DATASET=e2e, add the same POSTHOG_E2E_* env here to
      # verify ingestion against the real deployed bundle.
      # The step below tests the LIVE deployment, so this push races Dokploy's
      # autodeploy of the same commit. Proven 2026-08-06: a625be9's own test
      # failed at 14:40:44Z, two seconds before the deploy carrying its fix
      # finished at 14:40:46Z. Wait for the site to report this exact commit.
      #
      # Both branches now, not dev only. The old condition existed because prod
      # was a Dokploy *Nixpacks* app whose build context excluded the repo's
      # .git, so /api/version answered "unknown" and this gate could never pass
      # — with the standing note to drop it "when prod moves onto the root
      # compose". That happened on 2026-08-08: grabcaramel.com IS the compose
      # stack and answers a real sha.
      #
      # The two branches need OPPOSITE timeouts, because they deploy in
      # opposite ways:
      #   dev  — autodeploy ON. Wait out a real build (a push burst can queue
      #          one behind another), so 1200s.
      #   main — autoDeploy is OFF BY DESIGN on the prod compose. No deploy is
      #          coming, so waiting is pure latency: poll once and fail with the
      #          exact reason. Before this, a merge that changed any asserted
      #          copy surfaced as ~13 `locator.fill: Test timeout` errors after
      #          ~30 minutes (2026-08-09, the auth redesign) — all of which
      #          meant only "prod is still serving an older commit".
      - name: Wait for the deployment to carry this commit
        env:
          VERSION_URL: "${{ github.ref == 'refs/heads/dev' && 'https://dev.grabcaramel.com/api/version' || 'https://grabcaramel.com/api/version' }}"
          EXPECTED_SHA: '${{ github.sha }}'
          DEPLOY_WAIT_TIMEOUT_SECONDS: "${{ github.ref == 'refs/heads/dev' && '1200' || '0' }}"
          # Quoted: the prod branch of this expression contains ': ', which YAML
          # would otherwise read as a nested mapping key.
          DEPLOY_WAIT_HINT: "${{ github.ref == 'refs/heads/dev' && '' || 'Prod deploys are MANUAL: the Dokploy prod compose has autoDeploy OFF by design, so merging to main never reaches grabcaramel.com. This is not a failed deploy and not a broken build — the E2E suite runs against the LIVE site, so it cannot verify a commit prod is not serving. Deploy the prod compose, then re-run this job.' }}"
        run: bash .github/workflows/scripts/wait-for-deploy.sh

      - name: Run E2E tests
        working-directory: ./apps/caramel-app
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev.grabcaramel.com' || 'https://grabcaramel.com' }}
          PLAYWRIGHT_START_SERVER: 'false'
        run: pnpm test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-push
          path: apps/caramel-app/playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Lighthouse (PR – prod build, SEO/a11y budgets)
  # ─────────────────────────────────────────────────────────────
  # Locks in the coupon-page SEO elevation (2026-07-30): a production build is
  # served against the hermetic seeded Postgres and lighthouserc.json asserts
  # category budgets (SEO ≥0.95 + a11y ≥0.9 error; perf/best-practices warn) on
  # /, /coupons, a seeded store page, /supported-stores and /pricing.
  lighthouse:
    name: Lighthouse (SEO & a11y budgets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same known pin-drift as e2e-pr (postgres:15 vs compose 18.4) —
        # deliberately mirrored, not fixed here.
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caramel
        ports: ['58005:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d caramel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Production origin ON PURPOSE: robots.ts and next.config's X-Robots-Tag
      # noindex every non-production BASE_URL, which fails Lighthouse's
      # heavily-weighted is-crawlable audit and caps the SEO score — the very
      # category this job gates. The server still listens on localhost; only
      # origin-derived strings (canonicals, robots ruleset) see prod.
      NEXT_PUBLIC_BASE_URL: https://grabcaramel.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write minimal CI env
        run: pnpm --filter caramel-app run setup:ci-env

      - name: Generate Prisma Client
        run: pnpm --filter caramel-app exec prisma generate

      - name: Apply Prisma migrations (seeds the synthetic catalog)
        working-directory: ./apps/caramel-app
        run: pnpm exec prisma migrate deploy

      - name: Build production bundle
        working-directory: ./apps/caramel-app
        run: pnpm build

      - name: Run Lighthouse CI
        working-directory: ./apps/caramel-app
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: apps/caramel-app/lighthouse-reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # One-root-compose build (F-016) — clean-volume build + boot + migrate proof
  # ─────────────────────────────────────────────────────────────
  compose-build:
    name: One-root-compose build
    # PR-only + heavy, like e2e-pr. checks-app.yml is a shared workflow, so it
    # can't use on.push.paths without gating every other job — a first `git
    # diff` step path-filters this job instead (mirrors the intent of
    # ai-evals.yml's path filter). A clean runner gives clean volumes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect compose-relevant changes
        id: filter
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|docker-compose\.yml|docker-entrypoint\.sh|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|apps/caramel-app/package\.json|apps/caramel-app/next\.config\.mjs|apps/caramel-app/prisma/|apps/caramel-app/\.env\.example)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No compose-relevant paths changed — skipping the heavy build."
          fi

      - name: Provide a throwaway app env (auth secret only; compose env overrides the DB URLs)
        if: steps.filter.outputs.run == 'true'
        run: printf 'BETTER_AUTH_SECRET=ci_compose_build_throwaway_secret\n' > apps/caramel-app/.env

      - name: Build and boot the stack
        if: steps.filter.outputs.run == 'true'
        run: docker compose up -d --build

      - name: Wait for web to become healthy
        if: steps.filter.outputs.run == 'true'
        run: |
          cid="$(docker compose ps -q web)"
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
            echo "attempt $i: web=$status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy)
                echo '::error::web became unhealthy'
                docker compose logs web
                exit 1
                ;;
            esac
            sleep 5
          done
          echo '::error::web did not become healthy in time'
          docker compose logs web
          exit 1

      - name: Assert the entrypoint ran prisma migrate deploy
        if: steps.filter.outputs.run == 'true'
        run: |
          docker compose logs web | grep -F '[entrypoint] applying prisma migrate deploy'
          docker compose logs web | grep -F '[entrypoint] migrations applied'

      - name: Assert the homepage serves 200
        if: steps.filter.outputs.run == 'true'
        run: curl -fsS -o /dev/null -w 'homepage HTTP %{http_code}\n' http://127.0.0.1:58000/

      - name: Tear down (clean volumes)
        if: ${{ always() && steps.filter.outputs.run == 'true' }}
        run: docker compose down -v
