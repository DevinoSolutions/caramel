name: Release – Apple App (iOS container + Safari extension)

# Builds apps/caramel-apple (the committed Xcode project: SwiftUI container app
# + the Safari Web Extension whose resources are the WXT build), archives it,
# signs it, uploads it to TestFlight and attaches the build to the INTERNAL
# TestFlight group "Devino". TestFlight ONLY: nothing here creates, edits or
# submits an App Store version or sends anything to App Review. The existing
# App Store versions (1.4.x) and their builds are never touched: the attach
# step addresses one build by (marketing version, build number) and refuses
# anything whose pre-release version is not the one this run built.
#
# Triggers (owner pushes the tags; agents never do):
#   - tag `apple-v<MARKETING_VERSION>` (must equal MARKETING_VERSION in
#     apps/caramel-apple/project.yml; `v*` tags belong to release-extension.yml)
#   - workflow_dispatch (the workflow file must exist on the default branch). `internal_preview`
#     (default false) lets a dispatch FROM main past the T-7852 gate for an INTERNAL-only
#     TestFlight build; see the gate note below. Tag pushes ignore it and stay blocked. A preview
#     is also refused when the App Store version it would upload into (MARKETING_VERSION) is open
#     (asc-testflight.mjs version-state), so it can never join a train being shipped.
#   - pull_request touching apps/caramel-apple: builds and archives UNSIGNED and
#     verifies the committed Xcode project matches project.yml. It never signs
#     or uploads, so CI proves the build before anything can ship.
#
# Secrets reused from release-extension.yml (names only): ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_API_KEY_BASE64, APPLE_TEAM_ID, APPLE_ID,
# APPLE_APP_PASSWORD. Repository variable: SAFARI_BUNDLE_ID
# (com.devino.Caramel). No certificate is imported: xcodebuild mints its own
# through the App Store Connect API key (see the revoke step below).
#
# Build number (CFBundleVersion): highest iOS build already on the app + 1,
# read from the App Store Connect API (asc-testflight.mjs next-build-number).
# That is the same rule release-extension.yml uses, so both workflows continue
# one monotonic line and a new build can never collide with an existing one.

on:
  push:
    tags: ['apple-v*']
  workflow_dispatch:
    inputs:
      internal_preview:
        description: 'true = allow an INTERNAL-only build (TestFlight group Devino) while TODO(T-7852) markers remain; web tabs are signed out. Tag pushes ignore this and stay blocked. Never submit such a build for review.'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/caramel-apple/**'
      - '.github/workflows/release-apple-app.yml'
      - '.github/workflows/scripts/asc-testflight.mjs'

concurrency:
  group: release-apple-app-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUNDLE_ID: ${{ vars.SAFARI_BUNDLE_ID || 'com.devino.Caramel' }}
  EXTENSION_DIR: ${{ vars.WORKING_DIRECTORY || 'apps/caramel-extension' }}
  APPLE_DIR: apps/caramel-apple
  TESTFLIGHT_GROUP: Devino
  # The MV3 floor lives in project.yml (deploymentTarget.iOS); asserted after archive.
  IOS_DEPLOYMENT_FLOOR: '16.4'
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  apple:
    name: ${{ github.event_name == 'pull_request' && 'Build + archive (unsigned, no upload)' || 'Archive, sign, upload to TestFlight' }}
    runs-on: macos-latest
    timeout-minutes: 90
    # The drift-diagnostics upload uses DevinoSolutions/artifact (GitHub OIDC token; T-7021: GitHub
    # artifacts are blocked org-wide); a job-level block replaces the workflow-level one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      # project.yml is the one version authority for the Apple app. A tag must
      # say exactly that version, so a stale tag can never ship a different one.
      - name: Resolve and guard the marketing version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^ *MARKETING_VERSION: *'?([0-9]+\.[0-9]+\.[0-9]+)'?.*/\1/p" "${APPLE_DIR}/project.yml" | head -1)
          if [ -z "$version" ]; then
            echo "::error::Could not read MARKETING_VERSION (X.Y.Z) from ${APPLE_DIR}/project.yml."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "apple-v${version}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match project.yml MARKETING_VERSION — expected 'apple-v${version}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Apple app marketing version: ${version}" >> "$GITHUB_STEP_SUMMARY"

      # The 1.6 shell shows grabcaramel.com in a WKWebView with NO web session until the handoff
      # (POST /api/app/web-session/handoff, T-7852) is wired: the Saved and Account tabs open signed
      # out. Every TODO(T-7852) marker in the app source is part of that unfinished work, so a
      # tag/dispatch build stops while any is left. Never runs on pull requests. The only way past
      # it is a workflow_dispatch from main with internal_preview = true (INTERNAL TestFlight group
      # only; the markers print as warnings and the run is labelled INTERNAL PREVIEW).
      - name: Show the unfinished web-session handoff (T-7852) markers (warning only on pull requests)
        if: github.event_name == 'pull_request'
        run: |
          grep -rn 'TODO(T-7852)' "$APPLE_DIR/App" | while IFS= read -r line; do echo "::warning::$line"; done

      - name: Block the release while the web-session handoff (T-7852) is unfinished
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTERNAL_PREVIEW: ${{ inputs.internal_preview }}
          REF: ${{ github.ref }}
        run: |
          markers="$(grep -rn 'TODO(T-7852)' "$APPLE_DIR/App" || true)"
          if [ -n "$markers" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INTERNAL_PREVIEW" = "true" ] && [ "$REF" = "refs/heads/main" ]; then
              while IFS= read -r line; do echo "::warning::$line"; done <<<"$markers"
              echo "::warning::INTERNAL PREVIEW build: the iOS web tabs have no web session yet (T-7852 unfinished), so Saved and Account open signed out. TestFlight group Devino only; never submit this build for review."
              {
                echo "### INTERNAL PREVIEW — not for App Store submission; T-7852 markers present"
                echo
                echo "The web tabs of this build are signed out. Markers still present:"
                echo
                echo '```'
                echo "$markers"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Release stopped on purpose: the iOS web tabs have no web session yet, so Saved and Account do not work for signed-in users. T-7852 (POST /api/app/web-session/handoff, wired into ShellRouter.signInFromWeb) is unfinished. Remove the TODO(T-7852) markers once it ships, then the owner re-tags. Markers still present:"
              echo "$markers"
              exit 1
            fi
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The committed project must be exactly what project.yml generates with the
      # pinned XcodeGen. On drift the freshly generated files are uploaded so the
      # fix is a copy, not a guess; the step after it fails the job.
      - name: Regenerate the Xcode project from project.yml
        run: ${{ env.APPLE_DIR }}/scripts/generate-project.sh

      - name: Detect drift between the committed and generated project
        id: drift
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- "${APPLE_DIR}")" ]; then
            git status --short -- "${APPLE_DIR}"
            git diff --stat -- "${APPLE_DIR}"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      # The summary carries the drift itself, so the fix does not depend on the artifact below.
      - name: Summarize the project drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          {
            echo '### Xcode project drift'
            echo
            echo "\`${APPLE_DIR}\` differs from what project.yml generates:"
            echo
            echo '```'
            git status --short -- "${APPLE_DIR}"
            git diff --stat -- "${APPLE_DIR}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the generated project (drift diagnostics)
        if: steps.drift.outputs.drift == 'true'
        continue-on-error: true
        uses: DevinoSolutions/artifact/upload@v1
        with:
          name: generated-caramel-apple
          path: |
            ${{ env.APPLE_DIR }}/Caramel.xcodeproj
            ${{ env.APPLE_DIR }}/App/Info.plist
            ${{ env.APPLE_DIR }}/App/Caramel.entitlements
            ${{ env.APPLE_DIR }}/Extension/Info.plist
            ${{ env.APPLE_DIR }}/Extension/CaramelExtension.entitlements
          # T-7021: org artifact quota; a drift diff is only read on the run that failed.
          retention-days: 3

      - name: Fail on project drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::${APPLE_DIR} does not match what project.yml generates. Run ${APPLE_DIR}/scripts/generate-project.sh on a Mac (or take the 'generated-caramel-apple' artifact of this run) and commit the result."
          exit 1

      # PR mode only: the web shell's link-guard unit tests (CaramelTests scheme;
      # host-less, so no WXT build or signing is needed). The signed tag runs skip
      # it: the PR that changed the code already ran it.
      - name: Test the web shell link guard (unit tests)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || brew install jq
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | . as $rt
              | $rt.value[] | select(.name | test("^iPhone")) | {rt: $rt.key, name: .name, udid: .udid}]
            | sort_by(.rt, .name) | last | .udid // empty')
          [ -n "$udid" ] || { echo "::error::No available iPhone simulator on this runner image."; exit 1; }
          xcodebuild test \
            -project "${APPLE_DIR}/Caramel.xcodeproj" \
            -scheme CaramelTests \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile --filter "caramel-extension..."

      # No `--mode`: production is WXT's default, and a development-stamped build
      # would point real users' extensions at the dev deployment.
      - name: Build the extension (WXT)
        run: pnpm --filter caramel-extension run build

      - name: Derive .output/safari-mv3
        run: ${{ env.APPLE_DIR }}/scripts/derive-safari-build.sh

      - name: Install jq
        run: command -v jq >/dev/null 2>&1 || brew install jq

      # Everything below here signs or talks to App Store Connect; none of it
      # runs for pull requests (fork PRs would not have the secrets anyway).
      - name: Install App Store Connect API key
        if: github.event_name != 'pull_request'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "${ASC_API_KEY_BASE64}" | base64 --decode > "/tmp/AuthKey_${ASC_KEY_ID}.p8"
          ls -l "/tmp/AuthKey_${ASC_KEY_ID}.p8"

      # internal_preview only: a main-branch preview build must never land in a TestFlight train
      # that is being prepared or reviewed for the App Store (someone could pick it for submission).
      # Read-only ASC call; fails closed (API error, unknown state, missing state = refuse).
      - name: Refuse an internal preview into an open App Store train
        if: github.event_name == 'workflow_dispatch' && inputs.internal_preview
        env:
          ASC_KEY_PATH: /tmp/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! node .github/workflows/scripts/asc-testflight.mjs version-state "$MARKETING_VERSION"; then
            echo "::error::Internal preview refused: App Store version $MARKETING_VERSION is open (being prepared or reviewed) or its state could not be read. Bump MARKETING_VERSION in project.yml to the next train, or wait for that version to close. See the log above."
            exit 1
          fi

      - name: Resolve the next TestFlight build number
        id: build_number
        env:
          ASC_KEY_PATH: /tmp/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number=1
          else
            number=$(node .github/workflows/scripts/asc-testflight.mjs next-build-number)
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "CFBundleVersion for this run: ${number}" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive (unsigned, pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "${APPLE_DIR}/Caramel.xcodeproj" \
            -scheme Caramel \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/Caramel.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.number }}"

      - name: Archive (signed)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "${APPLE_DIR}/Caramel.xcodeproj" \
            -scheme Caramel \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/Caramel.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      # Prove what actually landed in the archive instead of trusting the
      # project: the extension must carry the WXT build at its resource root
      # (Safari reads manifest.json there), both bundles must carry the
      # version/build/floor, and the app must carry the export-compliance key
      # (without it every upload sits in TestFlight as "Missing Compliance").
      - name: Assert the archive contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.build_number.outputs.number }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/Caramel.xcarchive"
          app="${archive}/Products/Applications/Caramel.app"
          appex="${app}/PlugIns/Caramel Extension.appex"
          plist() { /usr/libexec/PlistBuddy -c "Print :$2" "$1"; }
          expect() { # file key expected
            actual=$(plist "$1" "$2")
            if [ "$actual" != "$3" ]; then
              echo "::error::$1 has $2='${actual}', expected '$3'."
              exit 1
            fi
            echo "ok: $(basename "$(dirname "$1")")/$(basename "$1") $2=${actual}"
          }
          [ -d "$app" ] || { echo "::error::No Caramel.app in the archive."; exit 1; }
          [ -d "$appex" ] || { echo "::error::The extension is not embedded in the app (PlugIns/Caramel Extension.appex)."; exit 1; }

          expect "$app/Info.plist" CFBundleIdentifier "${BUNDLE_ID}"
          expect "$appex/Info.plist" CFBundleIdentifier "${BUNDLE_ID}.Extension"
          for bundle in "$app" "$appex"; do
            expect "$bundle/Info.plist" CFBundleShortVersionString "${VERSION}"
            expect "$bundle/Info.plist" CFBundleVersion "${BUILD}"
            expect "$bundle/Info.plist" MinimumOSVersion "${IOS_DEPLOYMENT_FLOOR}"
          done
          expect "$app/Info.plist" ITSAppUsesNonExemptEncryption false
          expect "$appex/Info.plist" NSExtension:NSExtensionPointIdentifier com.apple.Safari.web-extension

          [ -f "$appex/manifest.json" ] || { echo "::error::The extension carries no manifest.json at its bundle root: the WXT build was not copied in."; exit 1; }
          jq -e '.manifest_version == 3' "$appex/manifest.json" >/dev/null || { echo "::error::manifest.json is not MV3."; exit 1; }
          echo "ok: extension manifest $(jq -er '"\(.name) \(.version)"' "$appex/manifest.json")"

      - name: Assert the App Group entitlement on both signed bundles
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/Caramel.xcarchive"
          for bundle in \
            "${archive}/Products/Applications/Caramel.app" \
            "${archive}/Products/Applications/Caramel.app/PlugIns/Caramel Extension.appex"; do
            entitlements=$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null)
            if ! grep -q "group.com.devino.Caramel" <<<"$entitlements"; then
              echo "::error::${bundle} is not signed with the group.com.devino.Caramel App Group."
              exit 1
            fi
            echo "ok: ${bundle} carries group.com.devino.Caramel"
          done

      - name: Write exportOptions
        if: github.event_name != 'pull_request'
        run: |
          cat > "${RUNNER_TEMP}/exportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Export the ipa
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Caramel.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/exportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/Exported" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ls -l "${RUNNER_TEMP}/Exported"

      - name: Upload the ipa to TestFlight
        if: github.event_name != 'pull_request'
        env:
          ALTOOL_USER: ${{ secrets.APPLE_ID }}
          ALTOOL_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ipa=$(find "${RUNNER_TEMP}/Exported" -name '*.ipa' -print -quit)
          [ -n "$ipa" ] || { echo "::error::Export produced no .ipa."; exit 1; }
          xcrun altool --upload-app -f "$ipa" -t ios \
            -u "$ALTOOL_USER" -p "$ALTOOL_PASSWORD" --verbose

      # Waits for App Store Connect to finish processing the upload, adds it to
      # the internal group and verifies the group's own state. Never touches an
      # App Store version, never submits for review.
      - name: Attach the build to the internal TestFlight group
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_PATH: /tmp/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: >-
          node .github/workflows/scripts/asc-testflight.mjs attach-build
          "${{ steps.version.outputs.version }}"
          "${{ steps.build_number.outputs.number }}"
          "${TESTFLIGHT_GROUP}"

      # `-allowProvisioningUpdates` mints a throwaway "Apple Development: Created
      # via API" certificate whenever the keychain holds no valid one, and its
      # key dies with this runner; unrevoked they hit Apple's cap and break every
      # later release. `always()` because a run that fails after archiving has
      # minted one too. Only certificates found in THIS runner's keychains are
      # revoked (same script release-extension.yml uses).
      - name: Revoke this run's throwaway development certificate
        if: always() && github.event_name != 'pull_request'
        run: node .github/workflows/scripts/revoke-run-dev-certs.mjs "/tmp/AuthKey_${ASC_KEY_ID}.p8"
