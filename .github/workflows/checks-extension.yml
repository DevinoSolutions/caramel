name: CI Checks – Extension

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}

jobs:
  lint_and_build:
    name: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY || github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ github.workspace }}/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run lint
      - name: Run Prettier check
        run: pnpm run prettier-check
      - name: Run knip
        run: pnpm run knip
      - name: Run unit tests
        run: pnpm run test
      - name: Check bundle size
        run: pnpm run size
      # WXT migration parity harness (P0, 2026-08-12): builds the old dist AND
      # the WXT .output per browser, then asserts semantic manifest parity
      # (scripts/parity-expected-diffs.json is the shrink-only allowlist),
      # NEVER_SHIP file inventory, and the build-time env stamp in both build
      # systems. Every migration phase must keep this green.
      - name: Run WXT parity harness
        run: pnpm run test:parity
      # TypeScript gate for the WXT surfaces (wxt.config.ts, entrypoints/) —
      # strict tsc, no any; `wxt prepare` generates .wxt/ types first.
      - name: Type-check WXT surfaces
        run: pnpm run type-check
      # Proves the allowlist in scripts/build-dist.mjs actually produces a
      # loadable package — tests/package-contents.test.mjs checks the file list,
      # this checks the build runs and lands the files it promises.
      - name: Build the store package
        run: pnpm run build

  # ─────────────────────────────────────────────────────────────
  # Extension E2E (E-02) — real Chromium + unpacked extension + local app
  # ─────────────────────────────────────────────────────────────
  # Runs scripts/test-extension.mjs: boots the real app (dev server + a real
  # Postgres, migrated AND catalog-seeded by `prisma migrate deploy`), loads a
  # PATCHED TEMP COPY of the extension (base URL -> localhost; see the suite
  # header — shipped code is never modified), and drives real login +
  # supported-stores + coupons + popup UI + applyCoupon() injection.
  # PR-only like checks-app.yml's e2e-pr job: it is the heavy DB-backed e2e
  # tier, and there is no deployed-extension equivalent of e2e-push to cover
  # pushes instead.
  e2e:
    name: extension e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Matches e2e-pr's pin (postgres:15) so the two e2e tiers run the same
        # database. (That pin's drift vs compose's postgres:18.4 is a known
        # punch-list item — resolve both together, deliberately NOT diverging
        # here.)
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caramel
        ports: ['58005:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d caramel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ github.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test-extension.mjs imports `playwright` from the extension workspace
      # (its own devDependency), so the browser install must run there too.
      - name: Install Playwright Chromium
        run: pnpm --filter caramel-extension exec playwright install --with-deps chromium

      # Writes apps/caramel-app/.env (DATABASE_URL -> the postgres service on
      # :58005, BETTER_AUTH secrets, NEXT_PUBLIC_BASE_URL=localhost:58000) —
      # what both `prisma migrate deploy` and the dev server below read.
      - name: Write minimal CI env
        run: pnpm --filter caramel-app run setup:ci-env

      - name: Generate Prisma Client
        run: pnpm --filter caramel-app exec prisma generate

      # Also seeds the app-owned coupon catalog (catalog_seed migration), so
      # the suite's supported-stores/coupons checks see real rows.
      - name: Apply Prisma migrations
        working-directory: ./apps/caramel-app
        run: pnpm exec prisma migrate deploy

      - name: Boot the app on :58000
        working-directory: ./apps/caramel-app
        run: |
          nohup pnpm exec next dev -p 58000 > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:58000/; then
              echo "app ready after attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo '::error::app never became ready on :58000'
          tail -50 /tmp/next-dev.log
          exit 1

      # Creates the suite's fixture login (test@caramel.dev / test1234) through
      # the REAL signup API, then flips email_verified directly in the DB — CI
      # cannot click a verification email (announced loudly in
      # e2e/support/seed-user.ts, which this script reuses).
      - name: Seed verified extension test user
        run: pnpm --filter caramel-app run seed:e2e-user

      # The MV3 service worker needs a headed Chromium (the suite launches
      # headless:false) — xvfb provides the display on the runner.
      - name: Run extension e2e suite
        run: |
          sudo apt-get -yqq install xvfb
          xvfb-run --auto-servernum pnpm --filter caramel-extension test:e2e

      # ─────────────────────────────────────────────────────────────
      # Guard suite — the bad-config safety proofs
      # ─────────────────────────────────────────────────────────────
      # Runs scripts/test-guards.mjs against the PACKAGED build, so it also
      # proves what actually ships is loadable. Needs no app and no network:
      # the store origin is route-intercepted and the caramel API is stubbed
      # inside the service worker, against a frozen production store config.
      # Covers the two things the unit suite structurally cannot — inventing a
      # savings figure, and clicking a checkout's order button — because
      # savings-plausibility.test.mjs stubs applyCoupon out entirely.
      - name: Build the store package
        run: pnpm --filter caramel-extension run build

      # Loads that PRODUCTION package in a real Chrome and asserts which
      # deployment it resolved to. Nothing else in CI does: the guards below
      # need a development stamp, and the e2e suite points its copy at the
      # local app — so without this, no browser ever sees what actually ships.
      # This is the check that would have caught the update_url heuristic.
      - name: Smoke the store package (production stamp, real browser)
        run: xvfb-run --auto-servernum pnpm --filter caramel-extension exec node scripts/smoke-package.mjs ./dist production

      # …and a second, DEVELOPMENT-stamped copy of that same package for the
      # guards to drive. Several guard checks assert on the extension's own
      # diagnostic markers (AUTO_INSERT_BASELINE_NARROWED, _REFUSED_CONTROL,
      # _EARLY_EXIT), which a shipped build deliberately does not print —
      # console-silence.test.mjs exists to keep our internals out of a
      # shopper's store console. Before the environment became a build-time
      # stamp this ran verbose by accident, because an unpacked directory has
      # no manifest update_url and the old heuristic read that as "dev": the
      # very bug this stamp replaced. Same packaged directory either way; only
      # the stamp differs, and the production one is still built above.
      - name: Build the packaged bundle the guards drive (development stamp)
        run: pnpm --filter caramel-extension exec node scripts/build-dist.mjs --env=development --out=dist-guards

      - name: Run extension guard suite (packaged build)
        env:
          CARAMEL_EXT_DIR: ./dist-guards
        run: xvfb-run --auto-servernum pnpm --filter caramel-extension test:guards
