name: Apple App – App Store screenshots (iOS Simulator)

# Photographs the container app (apps/caramel-apple) for the App Store
# listing: a 6.9" iPhone and a 13" iPad simulator, real iOS status bar
# (9:41, full wifi/cellular/battery), no browser chrome. Get started and Account
# are native; Deals, Search and Saved are the grabcaramel.com web screens inside the
# app's WKWebView (T-7842), so those shots show whatever the live site renders.
# Uploads the PNGs as the `appstore-screenshots` artifact. Nothing is signed, uploaded to App Store
# Connect or sent to review; it only reads grabcaramel.com's public read-only APIs.
#
# The app is driven by launch arguments (ScreenshotLaunch in AppConfig.swift,
# compiled in only under DEBUG, hence the Debug build below), not UI tests: `-screenshotTab onboarding|deals|search|saved|account|store:DOMAIN`.
#
# Triggers:
#   - workflow_dispatch (the workflow file must exist on the default branch)
#   - pull_request touching apps/caramel-apple or this file, so the PR itself
#     proves the capture works and produces the artifact.

on:
  workflow_dispatch:
    inputs:
      store_domain:
        description: 'Store shown on the store-detail screenshot (text only in the app)'
        required: false
        default: 'humehealth.com'
        type: string
  pull_request:
    paths:
      - 'apps/caramel-apple/**'
      - '.github/workflows/apple-app-screenshots.yml'

concurrency:
  group: apple-app-screenshots-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUNDLE_ID: com.devino.Caramel
  APPLE_DIR: apps/caramel-apple
  STORE_DOMAIN: ${{ inputs.store_domain || 'humehealth.com' }}
  # Stores seeded into the on-device saved-stores mirror that the Account tab's alerts read.
  # (The Saved tab itself is the web page now and does not show them.)
  SAVED_STORES: humehealth.com,yesglasses.com,bumbleandbumble.com
  SHOTS_DIR: ${{ github.workspace }}/screenshots

jobs:
  screenshots:
    name: Capture App Store screenshots (iPhone 6.9" + iPad 13")
    runs-on: macos-latest
    timeout-minutes: 60
    # The screenshots upload uses DevinoSolutions/artifact (GitHub OIDC token; T-7021: GitHub
    # artifacts are blocked org-wide); a job-level block replaces the workflow-level one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile --filter "caramel-extension..."

      # The Xcode project embeds the WXT build (copy phase fails without it).
      - name: Build the extension (WXT)
        run: pnpm --filter caramel-extension run build

      - name: Derive .output/safari-mv3
        run: ${{ env.APPLE_DIR }}/scripts/derive-safari-build.sh

      - name: Install jq
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${APPLE_DIR}/Caramel.xcodeproj" \
            -scheme Caramel \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          app="${RUNNER_TEMP}/DerivedData/Build/Products/Debug-iphonesimulator/Caramel.app"
          [ -d "$app" ] || { echo "::error::Simulator build produced no Caramel.app at ${app}."; exit 1; }
          echo "APP_PATH=${app}" >> "$GITHUB_ENV"

      - name: Pick the simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          pick() { # jq name regex -> newest matching available device UDID
            xcrun simctl list devices available -j | jq -r --arg re "$1" '
              [.devices | to_entries[] | select(.key | test("iOS")) | . as $rt
                | $rt.value[] | select(.name | test($re)) | {rt: $rt.key, name: .name, udid: .udid}]
              | sort_by(.rt, .name) | last | .udid // empty'
          }
          iphone=$(pick '^iPhone [0-9]+ Pro Max$')
          ipad=$(pick '^iPad Pro 13-inch')
          [ -n "$iphone" ] || { echo "::error::No available 'iPhone NN Pro Max' simulator on this runner image."; exit 1; }
          [ -n "$ipad" ] || { echo "::error::No available 'iPad Pro 13-inch' simulator on this runner image."; exit 1; }
          echo "IPHONE_UDID=${iphone}" >> "$GITHUB_ENV"
          echo "IPAD_UDID=${ipad}" >> "$GITHUB_ENV"

      # App Store content rules: nothing shown may mention free shipping/gifts or a
      # competitor. The app lists exactly what these public APIs return, so check
      # them first and fail with the offender instead of shipping a bad frame.
      # Fix a failure by passing another store_domain (or re-running when the live
      # Deals feed has rotated).
      - name: Check the captured content is clean
        run: |
          set -euo pipefail
          pattern='free|honey|rakuten|capital ?one'
          base="https://grabcaramel.com"
          store=$(curl -fsS "${base}/api/coupons?site=${STORE_DOMAIN}&limit=50" | jq -c '.coupons[:12][] | [.code, .title, .description]')
          deals=$(curl -fsS "${base}/api/coupons/recently-worked" | jq -c '.coupons[] | [.code, .title, .storeDomain]')
          [ -n "$store" ] || { echo "::error::No coupons returned for ${STORE_DOMAIN}."; exit 1; }
          [ -n "$deals" ] || { echo "::error::The recently-worked feed returned no coupons."; exit 1; }
          status=0
          for feed in store deals; do
            hits=$(grep -Ei "$pattern" <<<"${!feed}" || true)
            if [ -n "$hits" ]; then
              echo "::error::The $feed screenshot would show banned wording (free / honey / rakuten / capital one):"
              echo "$hits"
              status=1
            fi
          done
          exit "$status"

      - name: Capture the screenshots
        run: |
          set -euo pipefail
          mkdir -p "${SHOTS_DIR}"

          capture() { # label udid
            label="$1"; udid="$2"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            # A real-looking status bar: 9:41, wifi + cellular full, battery 100%.
            xcrun simctl status_bar "$udid" override \
              --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "${APP_PATH}"

            n=0
            app_running() { # a launched app that crashed leaves SpringBoard (the home screen) in the frame
              xcrun simctl spawn "$udid" launchctl list | grep -F "UIKitApplication:${BUNDLE_ID}[" | awk '$1 != "-" {found = 1} END {exit !found}'
            }
            shoot() { # name [extra launch args...]
              name="$1"; shift
              n=$((n + 1))
              out="${SHOTS_DIR}/${label}-$(printf '%02d' "$n")-${name}.png"
              # Relaunch until the app is alive and the frame is not blank (a white frame
              # compresses to a tiny PNG): a flaky launch must not become a bad store image.
              attempt=1
              while true; do
                xcrun simctl terminate "$udid" "${BUNDLE_ID}" >/dev/null 2>&1 || true
                xcrun simctl launch "$udid" "${BUNDLE_ID}" "$@"
                sleep 10 # network content (prod read-only APIs) has to land
                if app_running; then
                  xcrun simctl io "$udid" screenshot --type=png "$out"
                  if app_running && [ "$(stat -f%z "$out")" -ge 150000 ]; then break; fi
                fi
                if [ "$attempt" -ge 3 ]; then echo "::error::${out}: the app crashed or drew a blank frame on all ${attempt} launches."; exit 1; fi
                echo "::warning::${out}: attempt ${attempt} crashed or was blank; relaunching."
                attempt=$((attempt + 1))
              done
              echo "captured ${out}: $(sips -g pixelWidth -g pixelHeight "$out" | awk '/pixel/ {printf "%s ", $2}')"
            }

            shoot get-started -screenshotTab onboarding
            shoot deals -screenshotTab deals
            shoot search -screenshotTab search
            shoot store -screenshotTab "store:${STORE_DOMAIN}"
            shoot saved -screenshotTab saved -screenshotSavedStores "${SAVED_STORES}"
            shoot account -screenshotTab account

            xcrun simctl status_bar "$udid" clear
            xcrun simctl shutdown "$udid"
          }

          capture iphone-6.9 "${IPHONE_UDID}"
          capture ipad-13 "${IPAD_UDID}"

      # App Store Connect accepts these exact sizes for the 6.9" iPhone and the
      # 13" iPad slots; anything else means the wrong simulator was picked.
      - name: Assert the screenshot sizes
        run: |
          set -euo pipefail
          status=0
          for f in "${SHOTS_DIR}"/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            case "$(basename "$f"):${w}x${h}" in
              iphone-6.9-*:1320x2868|iphone-6.9-*:1290x2796|ipad-13-*:2064x2752) echo "ok: $(basename "$f") ${w}x${h}" ;;
              *) echo "::error::$(basename "$f") is ${w}x${h}, not an accepted App Store size."; status=1 ;;
            esac
          done
          exit "$status"

      # The sizes were asserted above, which is what fails the job. The list here is the evidence
      # that survives a store problem with the upload below.
      - name: Summarize the screenshots
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### App Store screenshots'
            echo
            echo "$(ls "${SHOTS_DIR}"/*.png 2>/dev/null | wc -l | tr -d ' ') PNG files"
            echo
            for f in "${SHOTS_DIR}"/*.png; do
              [ -f "$f" ] || continue
              echo "- \`$(basename "$f")\`: $(stat -f%z "$f") bytes, $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: DevinoSolutions/artifact/upload@v1
        with:
          name: appstore-screenshots
          path: ${{ env.SHOTS_DIR }}/*.png
          if-no-files-found: warn
          # T-7021: org artifact quota. Screenshots are re-generated by any run; evidence, so 1 day.
          retention-days: 1
