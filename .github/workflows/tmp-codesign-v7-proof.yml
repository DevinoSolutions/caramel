# TEMPORARY: proves apple-actions/import-codesign-certs v7 imports both release
# certificates as usably as v2 does, the way release-extension.yml /
# release-apple-app.yml use them (v5 dropped `security import -A`). The same
# probe runs once per version so the two are compared on the same runner image.
# Deleted before this PR merges.
name: tmp codesign v7 proof
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-codesign-v7-proof.yml'
permissions:
  contents: read
jobs:
  v2:
    runs-on: macos-latest
    steps:
      - uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - uses: apple-actions/import-codesign-certs@v2
        with:
          create-keychain: false
          keychain: signing_temp
          p12-file-base64: ${{ secrets.APPLE_DEV_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Probe
        run: |
          set -uo pipefail
          kc=signing_temp.keychain
          echo "identities (any): $(security find-identity -p codesigning "$kc" | grep -cE '^\s+[0-9]+\)')"
          echo "identities (valid): $(security find-identity -v -p codesigning "$kc" | grep -cE '^\s+[0-9]+\)')"
          security find-identity -p codesigning "$kc" | grep -oE 'CSSMERR_[A-Z_]+' | sort | uniq -c || true
          for who in "Apple Distribution" "Apple Development"; do
            f="$RUNNER_TEMP/probe-${who// /-}"
            cp /bin/echo "$f"
            if codesign --force --timestamp=none --keychain "$kc" --sign "$who" "$f" 2>"$f.err"; then
              echo "$who: signed"
            else
              echo "$who: FAILED ($(grep -oE 'errSec[A-Za-z]+|unable to build chain[^\n]*|ambiguous|no identity found' "$f.err" | head -1))"
            fi
          done
  v7:
    runs-on: macos-latest
    steps:
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - uses: apple-actions/import-codesign-certs@v7
        with:
          create-keychain: false
          keychain: signing_temp
          p12-file-base64: ${{ secrets.APPLE_DEV_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Probe
        run: |
          set -uo pipefail
          kc=signing_temp.keychain
          echo "identities (any): $(security find-identity -p codesigning "$kc" | grep -cE '^\s+[0-9]+\)')"
          echo "identities (valid): $(security find-identity -v -p codesigning "$kc" | grep -cE '^\s+[0-9]+\)')"
          security find-identity -p codesigning "$kc" | grep -oE 'CSSMERR_[A-Z_]+' | sort | uniq -c || true
          for who in "Apple Distribution" "Apple Development"; do
            f="$RUNNER_TEMP/probe-${who// /-}"
            cp /bin/echo "$f"
            if codesign --force --timestamp=none --keychain "$kc" --sign "$who" "$f" 2>"$f.err"; then
              echo "$who: signed"
            else
              echo "$who: FAILED ($(grep -oE 'errSec[A-Za-z]+|unable to build chain[^\n]*|ambiguous|no identity found' "$f.err" | head -1))"
            fi
          done
