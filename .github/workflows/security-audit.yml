name: Security audit

# Calls the org reusable audit (advisory table + stale pnpm.overrides check) on every PR.
# checks-app.yml keeps its own prod-scoped OSV gate (`audit` job); this one adds the
# override-ceiling check nothing else performs. T-6744.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    uses: DevinoSolutions/.github/.github/workflows/security-audit.yml@main
    with:
      runner: ubuntu-latest
