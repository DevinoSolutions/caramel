# Dependabot: weekly grouped version updates AND grouped security updates (T-6744).
#
# This replaces the earlier security-only file (`open-pull-requests-limit: 0`), which
# switched version updates off entirely. Never set that limit to 0: it hides the
# stale-dependency drift that turned the 2026-10-22 next/sharp/dompurify advisories
# into a fleet-wide scramble.
#
# One npm entry per directory that has a package.json (root + the three workspace
# members), plus github-actions, docker and pip for the manifests this repo carries.
# `target-branch` is deliberately absent: with it set, security updates stop following
# the ecosystem options and always target the default branch anyway.
#
# TODO: the org reusable security-audit.yml (stale pnpm.overrides check) cannot be called from here: caramel is a PUBLIC repo and DevinoSolutions/.github is PRIVATE, so GitHub reports "workflow was not found". Needs an owner decision (inline the override check or change visibility); checks-app.yml `audit` job remains the CI gate.
version: 2
updates:
  - package-ecosystem: 'npm' # covers the pnpm lockfile
    directories:
      - '/'
      - '/apps/caramel-app'
      - '/apps/caramel-extension'
      - '/packages/caramel-ui'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2 # security updates ignore the cooldown
    ignore:
      # Each needs its own upgrade, which drops its entry; security updates are not affected.
      # prettier-plugin-tailwindcss 0.7+ mis-sorts Tailwind 3 variants; it goes with Tailwind 4 (T-6598).
      - dependency-name: 'prettier-plugin-tailwindcss'
        versions: ['>=0.7.0']
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # v7+ needs the Chrome Web Store API v2 publisher id (no CHROME_PUBLISHER_ID secret yet).
      - dependency-name: 'mnao305/chrome-extension-upload'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # Odd Node majors are never LTS (25 is already end-of-life). The image moves
      # to the next even LTS together with CI's setup-node `node-version`.
      - dependency-name: 'node'
        versions: ['25.x', '27.x']
  - package-ecosystem: 'pip' # apps/caramel-extension/brand/requirements-icons.txt
    directory: '/apps/caramel-extension/brand'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: 'gradle' # apps/caramel-android (gradle/libs.versions.toml + plugins)
    directory: '/apps/caramel-android'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      gradle-security:
        applies-to: security-updates
        patterns:
          - '*'
