# T-8305 proof, part B: after the /profile -> /login bounce the shell settles on its
# own sign-in state: the native "Sign in to Caramel" sheet over the "Sign in to see
# this page" overlay (the sheet is modal, so only the sheet is visible to the test).
appId: com.devino.Caramel
---
- extendedWaitUntil:
    visible: "Sign in to Caramel"
    timeout: 10000
- takeScreenshot: 04-saved-settled
- assertVisible: "Continue with Google"
