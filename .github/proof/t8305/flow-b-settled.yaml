# T-8305 proof, part B: after the /profile -> /login bounce the shell must settle on
# its own "Sign in to see this page" state and stay there (fixed build). The pre-fix
# 1.6.0 build steps back into /profile instead, so this state never appears.
appId: com.devino.Caramel
---
- extendedWaitUntil:
    visible: "Sign in to see this page"
    timeout: 10000
- takeScreenshot: 04-saved-settled
- assertVisible: "Sign in to Caramel"
